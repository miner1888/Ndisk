[package]
name = "ndisk"
version = "0.0.2"
edition = "2021"
description = "NDisk 多用户网盘:分片断点上传 · 在线预览编辑 · 目录权限 · 分享链接(Linux / Windows)"
default-run = "ndisk"

[dependencies]
axum = { version = "0.8", features = ["json", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "sync", "time", "signal", "process"] }
tokio-util = { version = "0.7", features = ["io", "compat"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
futures-core = "0.3"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pemfile = "2"
rust-embed = { version = "8", features = ["debug-embed"] }
percent-encoding = "2"
mimalloc = "0.1"
fs2 = "0.4"
async-trait = "0.1"

[dev-dependencies]
reqwest = { version = "0.12", features = ["blocking", "json"] }

# 仅 Windows 构建时用于把 assets/ndisk.ico 写入 exe 资源(见 build.rs)
[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[[bin]]
name = "ndisk"
path = "src/main.rs"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"
